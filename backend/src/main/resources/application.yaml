spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: journey-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  auth:
    cookie:
      name: journey_auth
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
tavily:
  api:
    key: ${TAVILY_API_KEY}
    url: https://api.tavily.com/search